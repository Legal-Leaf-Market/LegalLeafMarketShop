name: Commerce backend (Medusa)
# Builds commerce/, migrates a throwaway Postgres, sets the store up, imports
# the live Shopify catalog and runs the checkout smoke test against it.
on:
  push:
    paths: ["commerce/**", ".github/workflows/commerce.yml"]
  workflow_dispatch:

concurrency:
  group: commerce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: commerce
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost/legal_leaf
      STORE_CORS: http://localhost:8888
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
      JWT_SECRET: ci
      COOKIE_SECRET: ci
      SHOPIFY_STORE: czmeq0-ik.myshopify.com
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: legal_leaf
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: corepack enable && yarn install
      - name: Keep the resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yarn-lock
          path: commerce/yarn.lock
      - name: Build
        run: yarn build
      - name: Migrate
        run: npx medusa db:migrate
      - name: Store setup
        run: yarn setup
      - name: Store setup again (must be a no-op)
        run: yarn setup
      - name: Import Shopify catalog
        run: yarn import:shopify
      - name: Start server
        run: |
          nohup yarn dev > /tmp/medusa.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 2
          done
          cat /tmp/medusa.log; exit 1
      - name: Smoke test
        run: |
          export PUBLISHABLE_KEY=$(psql "$DATABASE_URL" -tAc "select token from api_key where title='Web storefront' and deleted_at is null limit 1")
          MIN_PRODUCTS=400 node ci/smoke.mjs
      - name: Server log
        if: always()
        run: tail -n 200 /tmp/medusa.log || true
