name: Shop catalog snapshot
# Refreshes public/shop/catalog.json (the static copy /shop falls back to) from
# the Shopify storefront and commits it to the branch it ran on.
on:
  workflow_dispatch:
  push:
    paths: ["tools/snapshot-catalog.mjs", ".github/workflows/snapshot-catalog.yml"]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot
        run: node tools/snapshot-catalog.mjs | tee /tmp/snapshot.txt
      - name: Commit
        run: |
          git config user.name "catalog-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add public/shop/catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "shop: refresh catalog snapshot" -m "$(head -9 /tmp/snapshot.txt)"
          git push
