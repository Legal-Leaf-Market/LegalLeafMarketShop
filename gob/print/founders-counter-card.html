<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:1800px;overflow:hidden;background:radial-gradient(120% 70% at 50% 0,#1d4430,#0f2a1d 60%,#0a1d14);
  color:#efe6cf;font-family:'Liberation Serif','DejaVu Serif',serif;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding-top:120px}
.frame{position:absolute;inset:48px;border:4px solid #c9853f;border-radius:8px}

.logo{width:560px}
h1{font-size:108px;line-height:1;margin:36px 0 18px;color:#e2a866;letter-spacing:.02em}
.lede{font-size:42px;margin:0 0 26px;max-width:900px}

.qr{width:520px;height:520px;padding:22px;background:#efe6cf;border:6px solid #c9853f;border-radius:10px}
.qr img{width:100%;height:100%;display:block}
.price{font-size:46px;margin:40px 0 10px}
.price b{color:#e2a866}
.fine{font-family:Inter,sans-serif;font-size:24px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;position:absolute;bottom:110px;left:0;right:0}
</style>
<div class="frame"></div>
<img class="logo" src="../../public/img/gob/logo-gold.png" alt="">
