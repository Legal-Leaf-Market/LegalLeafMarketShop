# netlify.toml — how this repo is served in production.
#
# THE WHOLE MODEL, IN THREE LINES:
#   public/              served as files. /foo is public/foo.html, with no rule.
#   netlify/functions/   api.mjs answers /api/*, /p/* and /admin by running the
#                        matching file in api/; three more run the nightly jobs.
#   this file            the redirects and headers for the FILES, and nothing
#                        about the functions except where they live.
#
# Settings here override the ones in the Netlify dashboard, so this file is the
# one to read when the two disagree.

[build]
  publish = "public"
  # NO `command`, ON PURPOSE. This is static files plus functions and there is
  # nothing to build (CLAUDE.md §2, §11). Before this line existed the dashboard
  # had no publish directory either, Netlify published the repository ROOT, and
  # the site answered "Page not found" at / while serving CLAUDE.md, api/ and
  # every other file in the repo to anyone who asked for it by name.

[functions]
  directory = "netlify/functions"
  # THE HANDLERS ARE FOUND AT RUN TIME, BY NAME (netlify/lib/routes.mjs), so the
  # bundler cannot see them by following imports. This puts them in the bundle.
  # It also carries the three files api/admin/ reads off disk beside itself
  # (_client-*.js and _client-styles.css), and api/package.json, whose
  # `"type": "module"` is what makes a .js file in api/ an ES module once it has
  # been copied somewhere the root package.json is not.
  included_files = ["api/**"]

# ---- redirects ---------------------------------------------------------------
# A PAGE NEEDS NO ENTRY HERE. public/foo.html is already served at /foo. What is
# listed is only what a file cannot say for itself.

# ---- THE BASE SITE IS CLOSED; THE SHOP IS SHOPIFY (2 Nov 2026) ----------------
# Owner, 2 Nov 2026: every page here now redirects to shop.legalleafmarket.shop.
# The deal shelves, library, reels and articles are retired in favour of the
# Shopify store; /consumables lives on as shop.legalleafmarket.shop/pages/dispensary,
# which reads this site's /api/products feed through public/shop-dispensary.js.
#
# PAGES ARE LISTED ONE BY ONE, NOT CAUGHT BY "/*", ON PURPOSE. A forced catch-all
# would also have to be taught to step around /api/*, /p/*, /admin (the function's
# config.path), the crons and /shop-dispensary.js, and getting that order wrong
# takes the dispensary page down with the rest. A list only touches what it names.
# A NEW PAGE IN public/ IS SERVED UNTIL IT IS ADDED HERE.
#
# KEPT UP, deliberately: /api/* and /p/* (function), /admin*, /shop-dispensary.js, /ll-shop.js,
# /js /css /img /assets, and the two operator tools /ig-studio and
# /coldwater-collect (noindex, used by the owner, not shoppers).
#
# 302 not 301: browsers cache a 301 for good, and this is reversible by deleting
# this block. force = true because every one of these paths is a real file, and a
# file shadows an unforced rule.
# THE CAFE IS THE HOMEPAGE (owner, 5 Nov 2026, from the SEO audit). "/" SERVES
# cafe.html as a 200 rewrite, so the address bar stays on legalleafmarket.shop/,
# and /cafe 301s here so the old URL folds into one page instead of competing
# with it. public/index.html is the old engine that tools/make-*.mjs read, so it
# stays on disk; /index.html just sends people home. Rules are matched against
# the URL that was asked for, so the rewrite to /cafe.html is not re-matched.
[[redirects]]
  from = "/"
  to = "/cafe.html"
  status = 200
  force = true

[[redirects]]
  from = "/cafe"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/consumable"
  to = "https://shop.legalleafmarket.shop/pages/dispensary"
