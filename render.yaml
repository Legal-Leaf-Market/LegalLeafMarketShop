# Render Blueprint for the store backend (commerce/, Medusa v2).
# Render dashboard -> New -> Blueprint -> pick this repo. It creates the
# Postgres database and the web service and wires them together. Netlify keeps
# serving the website; this only runs the store API and the admin.
#
# FREE TEST PLANS (owner, 27 Nov 2026). $0, with the free tier's limits:
# - the web service (512 MB RAM) sleeps after 15 minutes without a visitor and
#   takes about a minute to wake;
# - the free database expires 30 days after it is created and is deleted 14
#   days after that, with everything in it, unless it is upgraded first;
# - free services have no Shell and no pre-deploy step, so the database work and
#   the first admin invite run at the end of the build (commerce/render-build.sh).
# To keep it for real, change both plans below (for example web "starter" and
# Postgres "basic-256mb", about $13/month when this was written). Nothing else
# needs to change.
databases:
  - name: legal-leaf-db
    plan: free
    databaseName: legal_leaf
    user: legal_leaf

services:
  - type: web
    name: legal-leaf-commerce
    runtime: node
    plan: free
    rootDir: commerce
    buildCommand: bash render-build.sh
    # A heap cap below the free plan's 512 MB, so Node collects garbage harder
    # instead of the instance being killed for running out of memory.
    startCommand: cd .medusa/server && NODE_OPTIONS=--max-old-space-size=400 npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: YARN_ENABLE_IMMUTABLE_INSTALLS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: legal-leaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        value: https://legalleafmarket.shop,https://www.legalleafmarket.shop
      - key: ADMIN_CORS
        value: https://legal-leaf-commerce.onrender.com
      - key: AUTH_CORS
        value: https://legal-leaf-commerce.onrender.com,https://legalleafmarket.shop
      - key: MEDUSA_BACKEND_URL
        value: https://legal-leaf-commerce.onrender.com
      - key: IMAGE_BASE
        value: https://legalleafmarket.shop
      # The build prints a one-time admin invite for this address (see
      # commerce/render-build.sh). Delete it in Render once you have signed in.
      - key: ADMIN_INVITE_EMAIL
        value: jake@legalleafmarket.shop
      # Card processing is archived (the shop is cash at delivery). These stay
      # blank; Medusa only loads the NMI provider when they are set.
      - key: NMI_SECURITY_KEY
        sync: false
      - key: NMI_TOKENIZATION_KEY
        sync: false
      - key: NMI_WEBHOOK_SECRET
        sync: false
      - key: NMI_SANDBOX
        value: "true"
